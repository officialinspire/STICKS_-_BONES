name: Menu pagination verification
on:
  push:
    branches: [codex/menu-pagination-verify]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [e2e, qa, a11y, faults, matches, pwa, 'story:e2e', 'story:sweep']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npm run ${{ matrix.suite }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ strategy.job-index }}
          path: test-results/
          if-no-files-found: ignore
