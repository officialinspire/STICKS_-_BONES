name: Compare existing table QA
on:
  push:
    branches: [codex/menu-pagination-verify]
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        rev: [4db06c2716a822a3af6143eeeea42da8dc2a3aa2, c8d3a8feab70ab389a537cafb71458b030ce4af1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.rev }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npm run qa
        env:
          QA_ONLY: 667,text-scale
